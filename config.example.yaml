# 此文件仅为初始参考模板。v2 起 Web 控制台会自动维护 data/config.yaml，
# 无需手动编辑：启动容器后在 Web 界面添加账户即可。
#
# data/config.yaml 结构（由 Web 控制台自动生成与更新）：
#
# schedule: "08:30"            # 每天签到时间
# timezone: "Asia/Shanghai"    # 时区
# run_on_start: true           # 启动时立即执行一轮
#
# accounts:
#   # TRAE 网页登录模式（Web 界面粘贴 Cookie 导入，自动换取 token）
#   - name: trae-1
#     platform: trae
#     auth_type: web
#     cookie: "ttwid=...; sessionid=..."
#     web_base: "https://www.trae.cn"
#     ai_pay_host: "https://api.trae.cn"
#     user_id: "12345678"
#     username: "某用户"
#     region: "CN"
#     req_source: 3
#
#   # TRAE 客户端模式（tools/extract_credentials.py 导出，refresh_token 可长期续期）
#   - name: trae-2
#     platform: trae
#     auth_type: client
#     token: "..."
#     refresh_token: "..."
#     expires_at: "2026-10-01T08:00:00Z"
#     user_id: "12345678"
#     client_id: "ono9krqynydwx5"   # 刷新令牌所属客户端（Trae IDE；TRAE SOLO 为 en1oxy7wnw8j9n），
#                                   # 留空则刷新时自动识别
#     device_id: "1234567890123456" # 设备号：需为客户端真实签发（同步脚本自动携带，勿手编）；
#     machine_id: "..."             # 生成/编造的号领取时会被业务码 9074 拒收；
#                                   # 多账户共用同一设备号会触发 9095「同一设备每天只能签到一个账号」
#     req_source: 1
#
#   # WorkBuddy（Web 界面粘贴 .info 文件内容导入；token 过期需重新导入）
#   - name: workbuddy-1
#     platform: workbuddy
#     token: "accessToken"
#     uid: "用户 uid"
#     domain: ""
#     expires_at: 1758000000000
#
#   # Qoder（tools/extract_qoder_credentials.py 导出 JSON，Web 界面粘贴导入；
#   # refresh_token 可自动续期；openapi_base 由导入时自动探测）
#   - name: qoder-1
#     platform: qoder
#     token: "dt-..."            # 设备令牌
#     refresh_token: "drt-..."   # 刷新令牌（自动续期用）
#     expires_at: "2026-10-28T12:25:52Z"
#     openapi_base: "https://openapi.qoder.sh"   # 国际版；中国版为 openapi.qoder.com.cn
#     user_id: "019e..."
#     username: "昵称"
#     # 中国版账户额外需要机器指纹（国际版可省略）：
#     machine_token: "..."
#     machine_code: "..."
#     machine_type: "..."
  #     machine_id: "..."
  #     machine_os: "windows"
  #
  #   # CodeArts Agent（华为云码道；tools/extract_codearts_credentials.py 导出 JSON，
  #   # Web 界面粘贴导入；STS 凭据约 1 小时过期，refresh_token 可自动续期）
  #   - name: codearts-1
  #     platform: codearts
  #     access_key: "HSTA..."           # STS AccessKeyId
  #     secret_key: "..."               # STS SecretAccessKey
  #     security_token: "..."           # STS SecurityToken（约 1 小时过期）
  #     expires_at: "2026-10-11T11:51:00.503Z"
  #     refresh_token: "eyJ0eXA..."     # JWT 刷新令牌（一次性旋转，自动续期用）
  #     code_verifier: "..."            # PKCE code_verifier
  #     dpop_private_key:               # EC P-256 私钥 JWK
  #       kty: "EC"
  #       crv: "P-256"
  #       x: "..."
  #       y: "..."
  #       d: "..."
  #     dpop_public_key:                # EC P-256 公钥 JWK
  #       kty: "EC"
  #       crv: "P-256"
  #       x: "..."
  #       y: "..."
  #     domain_id: "..."
  #     account_id: "..."
  #     username: "昵称"
